; Alembic configuration.
;
; There is deliberately no sqlalchemy.url here. The connection string is a
; secret and belongs in the environment, not in a tracked file; migrations/env.py
; reads it from AETHERIS_DATABASE_MIGRATION_URL through the application settings.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
